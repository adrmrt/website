version: 2

updates:
  # package.json + package-lock.json
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Europe/Zurich"
    groups:
      all-npm:
        patterns: ["*"]
        applies-to: version-updates
      all-npm-security:
        patterns: ["*"]
        applies-to: security-updates
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions workflow versions (.github/workflows/*.yml)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Europe/Zurich"
    groups:
      all-actions:
        patterns: ["*"]
        applies-to: version-updates
      all-actions-security:
        patterns: ["*"]
        applies-to: security-updates
    commit-message:
      prefix: "chore"
      include: "scope"
