version: 2

updates:
  # package.json + package-lock.json
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Europe/Zurich"
    ignore:
      # @astrojs/check and typescript-eslint don't support TypeScript 7 yet.
      - dependency-name: "typescript"
        versions: ["7.x"]
      # eslint-plugin-jsx-a11y doesn't support ESLint 10 yet.
      - dependency-name: "eslint"
        versions: ["10.x"]
      # eslint-plugin-astro 2+ requires ESLint 10.
      - dependency-name: "eslint-plugin-astro"
        versions: [">= 2.0.0"]
    groups:
      all-npm:
        patterns: ["*"]
        applies-to: version-updates
      all-npm-security:
        patterns: ["*"]
        applies-to: security-updates
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions workflow versions (.github/workflows/*.yml)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "18:00"
      timezone: "Europe/Zurich"
    groups:
      all-actions:
        patterns: ["*"]
        applies-to: version-updates
      all-actions-security:
        patterns: ["*"]
        applies-to: security-updates
    commit-message:
      prefix: "chore"
      include: "scope"
